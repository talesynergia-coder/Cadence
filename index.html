<style>
:root{--bg:#f3eee4;--bg2:#ebe4d4;--card:#fbf8f1;--ink:#1c1a15;--mut:#7a7366;--line:#e1d9c8;--acc:#1f5c4a;--onacc:#f6f1e4;--hi:#f2c94c;--hia:.8;--danger:#b5412b;--shadow:0 1px 0 rgba(0,0,0,.03),0 14px 30px -20px rgba(70,45,0,.35);
  --serif:'Fraunces',Georgia,'Times New Roman',serif;--sans:'DM Sans',system-ui,-apple-system,'Segoe UI',sans-serif;--mono:'JetBrains Mono',ui-monospace,Menlo,Consolas,monospace;--r:20px}
:root[data-theme=dark]{--bg:#16140f;--bg2:#1d1a14;--card:#1f1c16;--ink:#f1ead9;--mut:#9a927f;--line:#322e24;--acc:#7fd1ae;--onacc:#10231b;--hia:.38;--danger:#e0785f;--shadow:0 14px 30px -20px rgba(0,0,0,.8)}
@media(prefers-color-scheme:dark){:root[data-theme=auto]{--bg:#16140f;--bg2:#1d1a14;--card:#1f1c16;--ink:#f1ead9;--mut:#9a927f;--line:#322e24;--acc:#7fd1ae;--onacc:#10231b;--hia:.38;--danger:#e0785f;--shadow:0 14px 30px -20px rgba(0,0,0,.8)}}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{min-height:100dvh;background:var(--bg);background-image:radial-gradient(900px 500px at 12% -8%,color-mix(in srgb,var(--hi) 14%,transparent),transparent 60%);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;-webkit-tap-highlight-color:transparent}
input,select,textarea{font:inherit;color:var(--ink);background:var(--bg);border:1.5px solid var(--line);border-radius:12px;padding:10px 13px;width:100%;color-scheme:light dark;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--acc)}
textarea{resize:vertical;min-height:88px}
::placeholder{color:var(--mut);opacity:.7}
.hl{background:linear-gradient(transparent 60%,color-mix(in srgb,var(--hi) calc(var(--hia)*100%),transparent) 60% 90%,transparent 90%);padding:0 .08em}
#app{display:grid;grid-template-columns:236px 1fr;min-height:100dvh}
/* rail */
#rail{position:sticky;top:0;height:100dvh;padding:26px 16px 20px;display:flex;flex-direction:column;gap:6px;border-right:1px solid var(--line);background:color-mix(in srgb,var(--bg2) 55%,transparent)}
.brand{display:flex;align-items:center;gap:10px;padding:0 8px 22px}
.brand svg{width:34px;height:34px;border-radius:10px}
.brand b{font-family:var(--serif);font-style:italic;font-weight:600;font-size:27px;letter-spacing:-.01em}
.nav{display:flex;align-items:center;gap:12px;padding:11px 12px;border-radius:14px;font-weight:700;font-size:14.5px;color:var(--mut);text-align:left;width:100%}
.nav svg{width:21px;height:21px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex:none}
.nav:hover{background:var(--bg2);color:var(--ink)}
.nav.on{background:var(--ink);color:var(--bg)}
.nav .dot{margin-left:auto;min-width:20px;height:20px;border-radius:10px;background:var(--hi);color:#2b2200;font-size:11px;display:grid;place-items:center;padding:0 6px}
.sp{flex:1}
.chip-exam{display:block;width:100%;text-align:left;padding:14px;border-radius:16px;background:var(--acc);color:var(--onacc)}
.chip-exam small{display:block;font-size:10.5px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;opacity:.75}
.chip-exam b{font-family:var(--serif);font-size:30px;font-weight:600;line-height:1.1}
/* main */
#main{padding:34px clamp(18px,3.4vw,44px) 70px;max-width:1180px;width:100%}
.ph{margin-bottom:22px;display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap}
h1{font-family:var(--serif);font-weight:600;font-size:clamp(32px,4.4vw,46px);line-height:1.05;letter-spacing:-.02em}
.sub{color:var(--mut);margin-top:6px}
h2{font-family:var(--serif);font-weight:600;font-size:21px;letter-spacing:-.01em}
.grid2{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:18px;align-items:start}
.col{display:flex;flex-direction:column;gap:18px;min-width:0}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px 20px;box-shadow:var(--shadow)}
.ch2{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:12px}
.ch2 small,.lbl{color:var(--mut);font-size:12px}
.lbl{display:block;margin:10px 0 5px;font-weight:700;letter-spacing:.02em}
.note{color:var(--mut);font-size:13px;line-height:1.5}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:11px 20px;border-radius:999px;font-weight:700;border:1.5px solid var(--line);background:var(--card);transition:transform .12s,background .15s}
.btn:active{transform:scale(.96)}
.btn.pri{background:var(--acc);border-color:var(--acc);color:var(--onacc)}
.btn.ink{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.btn.sm{padding:7px 13px;font-size:13px}
.btn.full{width:100%}
.btn[disabled]{opacity:.45;pointer-events:none}
.row{display:flex;gap:10px;align-items:center}.row.wrap{flex-wrap:wrap}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}.three{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chip{display:inline-flex;align-items:center;gap:7px;padding:7px 13px;border-radius:999px;border:1.5px solid var(--line);font-weight:700;font-size:13px;background:transparent}
.chip.on{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.chip i{width:9px;height:9px;border-radius:50%;background:var(--c,var(--mut));flex:none}
.x{width:28px;height:28px;border-radius:50%;color:var(--mut);font-size:19px;line-height:1;flex:none}.x:hover{background:var(--bg2);color:var(--ink)}
/* hero */
.hero{display:block;width:100%;text-align:left;background:var(--acc);color:var(--onacc);border-radius:26px;padding:26px 28px 24px;outline:1.5px dashed color-mix(in srgb,var(--onacc) 38%,transparent);outline-offset:-11px;box-shadow:var(--shadow)}
.hero .k{font-size:11.5px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;opacity:.8}
.hero .n{font-family:var(--serif);font-weight:600;font-size:clamp(84px,11vw,132px);line-height:.95;letter-spacing:-.04em;margin:10px 0 2px}
.hero .u{font-family:var(--serif);font-style:italic;font-size:22px}
.hero .t{font-family:var(--mono);font-size:13px;opacity:.78;margin-top:10px}
.hero .nx{margin-top:12px;font-size:13px;font-weight:700;padding:6px 12px;border-radius:999px;background:color-mix(in srgb,var(--onacc) 16%,transparent);display:inline-block}
/* timer */
.seg{display:flex;gap:4px;padding:4px;border-radius:999px;background:var(--bg2)}
.seg button{flex:1;padding:8px 6px;border-radius:999px;font-weight:700;font-size:13px;color:var(--mut)}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:0 1px 4px rgba(0,0,0,.12)}
.dial{position:relative;width:min(300px,78vw);aspect-ratio:1;margin:16px auto 6px;display:grid;place-items:center}

<body>
<div id="app">
  <nav id="rail"></nav>
  <main id="main"></main>
</div>
<div id="sheet"></div>
<div id="glance"></div>
<div id="mini"></div>
<div id="toast"></div>
<script>
(()=>{'use strict';
/* ═════════ helpers ═════════ */
const $=(s,r=document)=>r.querySelector(s);
const h=(t,p,...k)=>{const e=document.createElement(t);if(p)for(const x in p){const v=p[x];if(v==null||v===false)continue;if(x==='class')e.className=v;else if(x==='style')e.style.cssText=v;else if(x.startsWith('on'))e[x]=v;else e.setAttribute(x,v===true?'':v)}for(const c of k.flat(2))if(c!=null&&c!==false)e.append(c.nodeType?c:document.createTextNode(c));return e};
const NS='http://www.w3.org/2000/svg';
const sv=(t,p,...k)=>{const e=document.createElementNS(NS,t);if(p)for(const x in p)if(p[x]!=null)e.setAttribute(x,p[x]);for(const c of k.flat())if(c!=null)e.append(c.nodeType?c:document.createTextNode(c));return e};
const pad=n=>String(n).padStart(2,'0');
const ymd=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const pd=s=>{const[y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)};
const today=()=>ymd(new Date());
const addDays=(s,n)=>{const d=pd(s);d.setDate(d.getDate()+n);return ymd(d)};
const dl=(s,o)=>pd(s).toLocaleDateString('en-GB',o||{weekday:'short',day:'numeric',month:'short'});
const fm=m=>{m=Math.round(m);const a=Math.floor(m/60),b=m%60;return a?(b?`${a}h ${b}m`:`${a}h`):`${b}m`};
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const hms=ms=>{const s=Math.floor(ms/1000);const hh=Math.floor(s/3600);return (hh?hh+':':'')+pad(Math.floor(s/60)%60)+':'+pad(s%60)};
const clamp=(v,a,b)=>Math.min(b,Math.max(a,v));
const safeCol=c=>/^#[0-9a-f]{3,8}$/i.test(c||'')?c:'#8a8473';
let toastT;const toast=(m,ms=2600)=>{const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('show'),ms)};

/* ═════════ data ═════════ */
const KEY='cadence.v2',INT=[1,3,7,21,45],PAL=['#3f6fb5','#c4572e','#2f8a5b','#8a5fc4','#c49a2e','#2e9aa8','#c4466f'];
const D0={v:2,name:'',exam:{label:'NEET',date:'2026-12-31'},goalMin:360,theme:'auto',
  subjects:[{n:'Physics',c:'#3f6fb5'},{n:'Chemistry',c:'#c4572e'},{n:'Biology',c:'#2f8a5b'}],
  timer:{mode:'stopwatch',phase:'focus',acc:0,start:null,subject:'Physics',topic:''},
  sessions:[],chapters:[],tasks:[],mocks:[],sound:{vol:.4},themeMode:'song',themeColor:'#1f5c4a',songColor:null,clientId:''};
function load(){
  const base=JSON.parse(JSON.stringify(D0));let raw=null;
  try{raw=JSON.parse(localStorage.getItem(KEY))}catch(e){}
  if(raw&&typeof raw==='object')return norm(Object.assign(base,raw,{exam:Object.assign(base.exam,raw.exam||{}),timer:Object.assign(base.timer,raw.timer||{}),sound:Object.assign(base.sound,raw.sound||{})}));
  try{const o=JSON.parse(localStorage.getItem('study.v1'));if(o){ // migrate from the earlier tracker
    if(o.exam)base.exam=Object.assign(base.exam,o.exam);
    base.sessions=(o.sessions||[]).map(s=>({id:s.id||uid(),date:s.date,min:s.min,subject:'',topic:s.topic||''}));
    base.chapters=(o.chapters||[]).map(c=>({id:c.id||uid(),name:c.name,subject:c.subject||'',done:!!c.done,left:c.left||'',doneAt:c.doneAt||null,conf:0,rev:c.done?{i:0,next:addDays(c.doneAt||today(),1)}:null}));
    base.mocks=(o.mocks||[]).map(m=>({id:m.id||uid(),name:m.name,date:m.date,p:null,c:null,b:null}));
    base.chapters.forEach(c=>{if(c.subject&&!base.subjects.find(s=>s.n===c.subject))base.subjects.push({n:c.subject,c:PAL[base.subjects.length%PAL.length]})});
  }}catch(e){}
  return norm(base);
}
function norm(s){['sessions','chapters','tasks','mocks','subjects'].forEach(k=>{if(!Array.isArray(s[k]))s[k]=D0[k].slice()});if(!s.subjects.length)s.subjects=D0.subjects.slice();return s}
let S=load();
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
const ensureSubject=n=>{n=(n||'').trim();if(n&&!S.subjects.find(s=>s.n===n))S.subjects.push({n,c:PAL[S.subjects.length%PAL.length]});return n};
const sc=n=>safeCol((S.subjects.find(s=>s.n===n)||{}).c||'#8a8473');
const dayMin=d=>S.sessions.filter(s=>s.date===d).reduce((a,s)=>a+s.min,0);
const streak=()=>{let n=0,d=today();if(!dayMin(d))d=addDays(d,-1);while(dayMin(d)>0){n++;d=addDays(d,-1)}return n};
const logSession=(min,date,subject,topic,pomo)=>{S.sessions.push({id:uid(),date,min,subject:ensureSubject(subject),topic:(topic||'').trim(),pomo:!!pomo})};
const dueRev=()=>S.chapters.filter(c=>c.done&&c.rev&&c.rev.next<=today()).sort((a,b)=>a.rev.next.localeCompare(b.rev.next));

/* ═════════ timer ═════════ */
const PRE={'25-5':[25,5],'50-10':[50,10],'90-15':[90,15]};
const T=()=>S.timer,running=()=>!!T().start;
const tms=()=>T().acc+(T().start?Date.now()-T().start:0);
const tTarget=()=>{const p=PRE[T().mode];return p?(T().phase==='focus'?p[0]:p[1])*60000:0};
let draft={min:'',date:''};
function tToggle(){const t=T();if(t.start){t.acc=tms();t.start=null;draft={min:String(Math.max(1,Math.round(t.acc/60000))),date:today()}}else{t.start=Date.now();ac()}change()}
function tReset(){S.timer=Object.assign(S.timer,{acc:0,start:null,phase:'focus'});draft={min:'',date:''};change()}
function tLogSoFar(){const t=T(),m=Math.round(tms()/60000);if(m>=1){logSession(m,today(),t.subject,t.topic,isPomo());toast('Logged '+fm(m))}tReset()}
const isPomo=()=>T().mode!=='stopwatch';
function tComplete(){const t=T(),p=PRE[t.mode];
  if(t.phase==='focus'){logSession(p[0],today(),t.subject,t.topic,true);t.phase='break';t.acc=0;t.start=Date.now();bell();toast('Focus block logged — take a '+p[1]+' min break',4200)}
  else{t.phase='focus';t.acc=0;t.start=null;bell();toast('Break over — ready for the next block',4200)}
  change()}
/* sound */
