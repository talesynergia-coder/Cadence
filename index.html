<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Cadence</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/svg+xml" href="icons/icon.svg">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="theme-color" content="#f3eee4" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#16140f" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Cadence">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Fraunces:ital,opsz,wght@0,9..144,500..700;1,9..144,500..600&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f3eee4;--bg2:#ebe4d4;--card:#fbf8f1;--ink:#1c1a15;--mut:#7a7366;--line:#e1d9c8;--acc:#1f5c4a;--onacc:#f6f1e4;--hi:#f2c94c;--hia:.8;--danger:#b5412b;--shadow:0 1px 0 rgba(0,0,0,.03),0 14px 30px -20px rgba(70,45,0,.35);
  --serif:'Fraunces',Georgia,'Times New Roman',serif;--sans:'DM Sans',system-ui,-apple-system,'Segoe UI',sans-serif;--mono:'JetBrains Mono',ui-monospace,Menlo,Consolas,monospace;--r:20px}
:root[data-theme=dark]{--bg:#16140f;--bg2:#1d1a14;--card:#1f1c16;--ink:#f1ead9;--mut:#9a927f;--line:#322e24;--acc:#7fd1ae;--onacc:#10231b;--hia:.38;--danger:#e0785f;--shadow:0 14px 30px -20px rgba(0,0,0,.8)}
@media(prefers-color-scheme:dark){:root[data-theme=auto]{--bg:#16140f;--bg2:#1d1a14;--card:#1f1c16;--ink:#f1ead9;--mut:#9a927f;--line:#322e24;--acc:#7fd1ae;--onacc:#10231b;--hia:.38;--danger:#e0785f;--shadow:0 14px 30px -20px rgba(0,0,0,.8)}}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{min-height:100dvh;background:var(--bg);background-image:radial-gradient(900px 500px at 12% -8%,color-mix(in srgb,var(--hi) 14%,transparent),transparent 60%);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;-webkit-tap-highlight-color:transparent}
input,select,textarea{font:inherit;color:var(--ink);background:var(--bg);border:1.5px solid var(--line);border-radius:12px;padding:10px 13px;width:100%;color-scheme:light dark;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--acc)}
textarea{resize:vertical;min-height:88px}
::placeholder{color:var(--mut);opacity:.7}
.hl{background:linear-gradient(transparent 60%,color-mix(in srgb,var(--hi) calc(var(--hia)*100%),transparent) 60% 90%,transparent 90%);padding:0 .08em}
#app{display:grid;grid-template-columns:236px 1fr;min-height:100dvh}
/* rail */
#rail{position:sticky;top:0;height:100dvh;padding:26px 16px 20px;display:flex;flex-direction:column;gap:6px;border-right:1px solid var(--line);background:color-mix(in srgb,var(--bg2) 55%,transparent)}
.brand{display:flex;align-items:center;gap:10px;padding:0 8px 22px}
.brand svg{width:34px;height:34px;border-radius:10px}
.brand b{font-family:var(--serif);font-style:italic;font-weight:600;font-size:27px;letter-spacing:-.01em}
.nav{display:flex;align-items:center;gap:12px;padding:11px 12px;border-radius:14px;font-weight:700;font-size:14.5px;color:var(--mut);text-align:left;width:100%}
.nav svg{width:21px;height:21px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex:none}
.nav:hover{background:var(--bg2);color:var(--ink)}
.nav.on{background:var(--ink);color:var(--bg)}
.nav .dot{margin-left:auto;min-width:20px;height:20px;border-radius:10px;background:var(--hi);color:#2b2200;font-size:11px;display:grid;place-items:center;padding:0 6px}
.sp{flex:1}
.chip-exam{display:block;width:100%;text-align:left;padding:14px;border-radius:16px;background:var(--acc);color:var(--onacc)}
.chip-exam small{display:block;font-size:10.5px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;opacity:.75}
.chip-exam b{font-family:var(--serif);font-size:30px;font-weight:600;line-height:1.1}
/* main */
#main{padding:34px clamp(18px,3.4vw,44px) 70px;max-width:1180px;width:100%}
.ph{margin-bottom:22px;display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap}
h1{font-family:var(--serif);font-weight:600;font-size:clamp(32px,4.4vw,46px);line-height:1.05;letter-spacing:-.02em}
.sub{color:var(--mut);margin-top:6px}
h2{font-family:var(--serif);font-weight:600;font-size:21px;letter-spacing:-.01em}
.grid2{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:18px;align-items:start}
.col{display:flex;flex-direction:column;gap:18px;min-width:0}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px 20px;box-shadow:var(--shadow)}
.ch2{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:12px}
.ch2 small,.lbl{color:var(--mut);font-size:12px}
.lbl{display:block;margin:10px 0 5px;font-weight:700;letter-spacing:.02em}
.note{color:var(--mut);font-size:13px;line-height:1.5}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:11px 20px;border-radius:999px;font-weight:700;border:1.5px solid var(--line);background:var(--card);transition:transform .12s,background .15s}
.btn:active{transform:scale(.96)}
.btn.pri{background:var(--acc);border-color:var(--acc);color:var(--onacc)}
.btn.ink{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.btn.sm{padding:7px 13px;font-size:13px}
.btn.full{width:100%}
.btn[disabled]{opacity:.45;pointer-events:none}
.row{display:flex;gap:10px;align-items:center}.row.wrap{flex-wrap:wrap}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}.three{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chip{display:inline-flex;align-items:center;gap:7px;padding:7px 13px;border-radius:999px;border:1.5px solid var(--line);font-weight:700;font-size:13px;background:transparent}
.chip.on{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.chip i{width:9px;height:9px;border-radius:50%;background:var(--c,var(--mut));flex:none}
.x{width:28px;height:28px;border-radius:50%;color:var(--mut);font-size:19px;line-height:1;flex:none}.x:hover{background:var(--bg2);color:var(--ink)}
/* hero */
.hero{display:block;width:100%;text-align:left;background:var(--acc);color:var(--onacc);border-radius:26px;padding:26px 28px 24px;outline:1.5px dashed color-mix(in srgb,var(--onacc) 38%,transparent);outline-offset:-11px;box-shadow:var(--shadow)}
.hero .k{font-size:11.5px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;opacity:.8}
.hero .n{font-family:var(--serif);font-weight:600;font-size:clamp(84px,11vw,132px);line-height:.95;letter-spacing:-.04em;margin:10px 0 2px}
.hero .u{font-family:var(--serif);font-style:italic;font-size:22px}
.hero .t{font-family:var(--mono);font-size:13px;opacity:.78;margin-top:10px}
.hero .nx{margin-top:12px;font-size:13px;font-weight:700;padding:6px 12px;border-radius:999px;background:color-mix(in srgb,var(--onacc) 16%,transparent);display:inline-block}
/* timer */
.seg{display:flex;gap:4px;padding:4px;border-radius:999px;background:var(--bg2)}
.seg button{flex:1;padding:8px 6px;border-radius:999px;font-weight:700;font-size:13px;color:var(--mut)}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:0 1px 4px rgba(0,0,0,.12)}
.dial{position:relative;width:min(300px,78vw);aspect-ratio:1;margin:16px auto 6px;display:grid;place-items:center}
.dial svg{position:absolute;inset:0;width:100%;height:100%;transform:rotate(-90deg)}
.dial circle{fill:none;stroke-width:9;stroke-linecap:round}
.dial .bg{stroke:var(--bg2)}.dial .fg{stroke:var(--acc);transition:stroke-dashoffset .3s linear}
.dial.brk .fg{stroke:var(--hi)}
.dial .mid{text-align:center}
.disp{font-family:var(--mono);font-weight:700;font-size:clamp(40px,7vw,54px);letter-spacing:-.03em;line-height:1}
.phase{margin-top:8px;font-size:12px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--mut)}
.running .disp{color:var(--acc)}
.saveform{margin-top:14px;padding:14px;border-radius:16px;background:var(--bg2)}
/* goal ring */
.goal{display:flex;align-items:center;gap:18px}
.gring{position:relative;width:104px;height:104px;flex:none}
.gring svg{width:100%;height:100%;transform:rotate(-90deg)}
.gring circle{fill:none;stroke-width:10;stroke-linecap:round}
.gring .bg{stroke:var(--bg2)}.gring .fg{stroke:var(--acc)}
.gring b{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--serif);font-size:22px}
/* tasks */
.ruled{background-image:repeating-linear-gradient(transparent 0 37px,var(--line) 37px 38px);margin:0 -4px}
.task{display:flex;align-items:center;gap:10px;height:38px;padding:0 4px}
.task span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.task.done span{text-decoration:line-through;color:var(--mut)}
.task em{font-style:normal;font-size:11px;color:var(--danger);font-weight:700}
.ck{width:24px;height:24px;border-radius:50%;border:2px solid var(--mut);flex:none;display:grid;place-items:center;font-size:13px;font-weight:800;color:var(--onacc);transition:.15s}
.ck.on{background:var(--acc);border-color:var(--acc)}
.rev{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line)}.rev:last-child{border:0}
.rev .nm{flex:1;min-width:0}.rev .nm b{display:block;font-size:14px}.rev .nm small{color:var(--mut);font-size:12px}
.sdot{width:10px;height:10px;border-radius:50%;background:var(--c);flex:none}
/* syllabus */
.sbar{height:7px;border-radius:7px;background:var(--bg2);overflow:hidden;margin-top:6px}.sbar i{display:block;height:100%;background:var(--c,var(--acc));border-radius:7px;transition:width .4s}
.ovw{display:grid;grid-template-columns:auto 1fr;gap:24px;align-items:center}
.subs{display:grid;gap:12px}.subs b{font-size:13.5px}.subs small{color:var(--mut);float:right;font-size:12px}
.chl{padding:2px 0}
.chh{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.chh h2{display:flex;align-items:center;gap:10px}
.ch{display:flex;align-items:flex-start;gap:12px;padding:10px 2px;border-top:1px solid var(--line)}
.ch .nm{flex:1;min-width:0;line-height:1.3;padding-top:2px}.ch .nm b{font-weight:600}
.ch.done .nm>b{color:var(--mut);text-decoration:line-through}
.left{display:block;margin-top:5px;font-size:12px;font-weight:700;padding:3px 10px;border-radius:999px;background:color-mix(in srgb,var(--hi) 30%,transparent);color:var(--ink);text-align:left;max-width:100%}
.rb{display:inline-block;margin-top:5px;margin-right:6px;font-size:11.5px;color:var(--mut);font-weight:700}
.rb.due{color:var(--danger)}
.conf{display:flex;gap:3px;padding:8px 4px;flex:none}.conf i{width:7px;height:16px;border-radius:3px;background:var(--line)}.conf i.on{background:var(--acc)}.conf.w i.on{background:var(--danger)}
.tf{padding:6px 0 12px 36px;border-top:1px solid var(--line)}
/* calendar */
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:18px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px 16px}.stat b{display:block;font-family:var(--serif);font-size:28px;line-height:1.1}.stat span{color:var(--mut);font-size:12px}
.nav2{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.nav2 button{width:36px;height:36px;border-radius:50%;background:var(--bg2);font-size:18px}
.mgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.wd{font-size:11px;color:var(--mut);font-weight:700;text-align:center;padding:2px 0 4px}
.day{aspect-ratio:1;border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-variant-numeric:tabular-nums;background:var(--bg2);font-weight:600;font-size:14px;position:relative;min-height:44px}
.day small{font-size:9.5px;font-weight:700;opacity:.85;line-height:1;margin-top:2px}
.day.blank{background:none;pointer-events:none}
.day.today{box-shadow:inset 0 0 0 2px var(--ink)}
.day.sel{outline:2.5px solid var(--acc);outline-offset:2px}
.ent{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}.ent:last-of-type{border:0}.ent b{min-width:54px;font-family:var(--mono);font-size:13.5px}.ent span{flex:1;min-width:0;color:var(--mut)}
.legend{display:flex;flex-wrap:wrap;gap:12px;margin-top:8px;font-size:12px;color:var(--mut)}.legend span{display:flex;align-items:center;gap:6px}.legend i{width:10px;height:10px;border-radius:3px;background:var(--c)}
.chart{width:100%;height:auto;display:block}.chart text{font-family:var(--sans);font-size:10px;fill:var(--mut)}
.split{display:grid;gap:10px}.split .r{display:grid;grid-template-columns:96px 1fr 56px;gap:10px;align-items:center;font-size:13px}.split .r em{font-style:normal;text-align:right;font-family:var(--mono);font-size:12px;color:var(--mut)}
/* mocks */
.mock{display:grid;grid-template-columns:1fr auto;gap:6px 14px;padding:14px 0;border-top:1px solid var(--line);align-items:center}
.mock:first-of-type{border:0}.mock .tot{font-family:var(--serif);font-size:26px;font-weight:600;text-align:right;line-height:1}.mock .tot small{font-size:12px;color:var(--mut);font-family:var(--sans)}
.mock .pb{grid-column:1/-1;display:grid;grid-template-columns:repeat(3,1fr);gap:10px;font-size:12px;color:var(--mut)}
.mock .pb div b{color:var(--ink)}
.call{padding:12px 14px;border-radius:14px;background:color-mix(in srgb,var(--hi) 24%,transparent);font-size:14px;margin-bottom:14px}
/* sheet / glance / toast */
#sheet{position:fixed;inset:0;z-index:50;display:none}#sheet.open{display:block}
.scrim{position:absolute;inset:0;background:rgba(20,15,5,.45);backdrop-filter:blur(3px)}
.sbox{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:min(520px,calc(100vw - 28px));max-height:calc(100dvh - 40px);overflow:auto;background:var(--card);border-radius:24px;padding:20px 22px 24px;box-shadow:0 30px 80px rgba(0,0,0,.4)}
.sh{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}.sh b{font-family:var(--serif);font-size:24px;font-weight:600}
#glance{position:fixed;inset:0;z-index:40;display:none;background:var(--bg);padding:max(18px,env(safe-area-inset-top)) 22px 22px;overflow:auto}
#glance.open{display:block}
.gtop{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}
.gtop b{font-family:var(--serif);font-style:italic;font-size:26px;font-weight:600}
.gboard{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;height:calc(100dvh - 110px);min-height:520px}
.tile{border-radius:28px;padding:24px 26px;background:var(--card);border:1px solid var(--line);display:flex;flex-direction:column;justify-content:space-between;min-width:0;box-shadow:var(--shadow)}
.tile.acc{background:var(--acc);color:var(--onacc);border:0}
.tile .k{font-size:12px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;opacity:.65}
.tile .big{font-family:var(--mono);font-weight:700;font-size:clamp(48px,9vw,110px);letter-spacing:-.04em;line-height:1}
.tile .bign{font-family:var(--serif);font-weight:600;font-size:clamp(90px,16vw,200px);letter-spacing:-.05em;line-height:.9}
.tile.run .big{color:var(--acc)}
.tile .lines{font-size:15px;opacity:.8}
#toast{position:fixed;left:50%;bottom:calc(88px + env(safe-area-inset-bottom));transform:translate(-50%,16px);background:var(--ink);color:var(--bg);padding:11px 18px;border-radius:999px;font-weight:700;font-size:14px;opacity:0;pointer-events:none;transition:.28s;z-index:70;max-width:92vw;text-align:center}
#toast.show{opacity:1;transform:translate(-50%,0)}
@media(min-width:861px){#toast{bottom:28px}}
.empty{padding:14px 0;color:var(--mut);font-size:14px}
@media(max-width:1000px){.grid2{grid-template-columns:1fr}.stats{grid-template-columns:repeat(2,1fr)}}
@media(max-width:860px){
  #app{grid-template-columns:1fr}
  #rail{position:fixed;top:auto;bottom:0;left:0;right:0;height:auto;flex-direction:row;padding:6px 8px calc(6px + env(safe-area-inset-bottom));border-right:0;border-top:1px solid var(--line);background:color-mix(in srgb,var(--card) 94%,transparent);backdrop-filter:blur(18px);z-index:30;gap:2px}
  .brand,.sp,.chip-exam,.nav.desk{display:none}
  .nav{flex-direction:column;gap:3px;padding:7px 4px;font-size:11px;justify-content:center;text-align:center;flex:1;border-radius:12px}
  .nav .dot{position:absolute;margin:0;top:2px;right:18%}.nav{position:relative}
  #main{padding-bottom:110px}
  .gboard{grid-template-columns:1fr;height:auto}.tile{min-height:230px}
  .ovw{grid-template-columns:1fr}
}
</style>
</head>
<body>
<div id="app">
  <nav id="rail"></nav>
  <main id="main"></main>
</div>
<div id="sheet"></div>
<div id="glance"></div>
<div id="toast"></div>
<script>
(()=>{'use strict';
/* ═════════ helpers ═════════ */
const $=(s,r=document)=>r.querySelector(s);
const h=(t,p,...k)=>{const e=document.createElement(t);if(p)for(const x in p){const v=p[x];if(v==null||v===false)continue;if(x==='class')e.className=v;else if(x==='style')e.style.cssText=v;else if(x.startsWith('on'))e[x]=v;else e.setAttribute(x,v===true?'':v)}for(const c of k.flat(2))if(c!=null&&c!==false)e.append(c.nodeType?c:document.createTextNode(c));return e};
const NS='http://www.w3.org/2000/svg';
const sv=(t,p,...k)=>{const e=document.createElementNS(NS,t);if(p)for(const x in p)if(p[x]!=null)e.setAttribute(x,p[x]);for(const c of k.flat())if(c!=null)e.append(c.nodeType?c:document.createTextNode(c));return e};
const pad=n=>String(n).padStart(2,'0');
const ymd=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const pd=s=>{const[y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)};
const today=()=>ymd(new Date());
const addDays=(s,n)=>{const d=pd(s);d.setDate(d.getDate()+n);return ymd(d)};
const dl=(s,o)=>pd(s).toLocaleDateString('en-GB',o||{weekday:'short',day:'numeric',month:'short'});
const fm=m=>{m=Math.round(m);const a=Math.floor(m/60),b=m%60;return a?(b?`${a}h ${b}m`:`${a}h`):`${b}m`};
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const hms=ms=>{const s=Math.floor(ms/1000);const hh=Math.floor(s/3600);return (hh?hh+':':'')+pad(Math.floor(s/60)%60)+':'+pad(s%60)};
const clamp=(v,a,b)=>Math.min(b,Math.max(a,v));
const safeCol=c=>/^#[0-9a-f]{3,8}$/i.test(c||'')?c:'#8a8473';
let toastT;const toast=(m,ms=2600)=>{const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('show'),ms)};

/* ═════════ data ═════════ */
const KEY='cadence.v2',INT=[1,3,7,21,45],PAL=['#3f6fb5','#c4572e','#2f8a5b','#8a5fc4','#c49a2e','#2e9aa8','#c4466f'];
const D0={v:2,name:'',exam:{label:'NEET',date:'2026-12-31'},goalMin:360,theme:'auto',
  subjects:[{n:'Physics',c:'#3f6fb5'},{n:'Chemistry',c:'#c4572e'},{n:'Biology',c:'#2f8a5b'}],
  timer:{mode:'stopwatch',phase:'focus',acc:0,start:null,subject:'Physics',topic:''},
  sessions:[],chapters:[],tasks:[],mocks:[],sound:{vol:.4}};
function load(){
  const base=JSON.parse(JSON.stringify(D0));let raw=null;
  try{raw=JSON.parse(localStorage.getItem(KEY))}catch(e){}

  b.append(h('div',{class:'tile'},h('div',{class:'k'},'Today'),h('div',{class:'row',style:'gap:22px'},h('div',{class:'gring',style:'width:150px;height:150px'},ring(p,150,10),h('b',{style:'font-size:30px'},Math.round(p*100)+'%')),h('div',null,h('div',{style:'font-family:var(--serif);font-size:40px;font-weight:600;line-height:1.1'},fm(m)),h('div',{class:'lines'},'of '+fm(S.goalMin)+' goal'))),h('div',{class:'lines'},streak()?streak()+'-day streak':'No streak yet — start one today')));
  b.append(h('div',{class:'tile'},h('div',{class:'k'},'Syllabus & revision'),h('div',null,h('div',{class:'bign',style:'font-size:clamp(70px,12vw,150px)'},ch.length?Math.round(dn/ch.length*100)+'%':'—'),h('div',{class:'lines'},ch.length?dn+' of '+ch.length+' chapters done':'Add chapters in Syllabus')),h('div',{class:'lines'},d?d+' revision'+(d>1?'s':'')+' due today':'No revisions due')));
  g.append(b);tickUI()}

/* ═════════ live updates ═════════ */
function tickUI(){
  const t=T(),pomo=isPomo(),ms=tms();
  let disp,prog=0,phase='';
  if(pomo){const tg=tTarget();disp=hms(Math.max(0,tg-ms));prog=ms/tg;phase=(t.phase==='focus'?'Focus':'Break')+(running()?'':' · paused')}
  else{disp=hms(ms);prog=(ms%3600000)/3600000;phase=running()?'Studying':ms>0?'Paused':'Ready'}
  if(!pomo&&!running()&&ms===0)prog=0;
  let e=$('#tmDisp');if(e)e.textContent=disp;e=$('#tmPhase');if(e)e.textContent=phase;e=$('#tmRing');if(e)e.setAttribute('stroke-dashoffset',282.7*(1-clamp(prog,0,1)));
  e=$('#gDisp');if(e)e.textContent=disp;e=$('#gPh');if(e)e.textContent=pomo?phase:'';
  const c=countdown();
  [['hK',c.k],['hN',c.n],['hU',c.u],['hT',c.t],['gK',c.k],['gN',c.n],['gU',c.u]].forEach(([id,v])=>{const x=$('#'+id);if(x&&x.textContent!==v)x.textContent=v});
  e=$('#gT');if(e)e.textContent=c.t+(c.mk?'  ·  '+c.mk:'');
  e=$('#railN');if(e)e.textContent=c.n+(c.n==='1'?' day':' days');
  document.title=running()?hms(pomo?Math.max(0,tTarget()-ms):ms)+' · Cadence':'Cadence';
}
setInterval(()=>{if(running()&&isPomo()&&tms()>=tTarget()){tComplete();return}tickUI()},250);
let lastDay=today();setInterval(()=>{if(today()!==lastDay){lastDay=today();csel=csel||today();render()}},30000);
document.addEventListener('visibilitychange',async()=>{if(document.visibilityState==='visible'){tickUI();try{if($('#glance').classList.contains('open')&&'wakeLock' in navigator&&!wl)wl=await navigator.wakeLock.request('screen')}catch(e){}}});
addEventListener('keydown',e=>{if(e.key==='Escape'){if($('#sheet').classList.contains('open'))closeSheet();else if($('#glance').classList.contains('open'))closeGlance()}});

/* ═════════ boot ═════════ */
const VIEWS={focus:vFocus,syllabus:vSyllabus,calendar:vCalendar,mocks:vMocks};
try{const v=sessionStorage.getItem('cad.view');if(VIEWS[v])view=v}catch(e){}
if(location.hash==='#glance')setTimeout(()=>$('#glance').classList.add('open')||buildGlance(),0);
render();
if(running()&&isPomo()&&tms()>=tTarget())tComplete();
if('serviceWorker' in navigator&&/^https?:$/.test(location.protocol))navigator.serviceWorker.register('sw.js').catch(()=>{});
window.__cadence={S:()=>S,go,render};
})();
